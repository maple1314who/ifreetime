<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>read-tts 管理后台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e6e9ef; --muted: #9aa4b2; --brand: #6c8cff; --ok: #3fb950; --warn: #d29922; --err: #f85149;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
         background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: var(--brand); }
  .hidden { display: none !important; }

  /* 登录 */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
                padding: 36px; width: 100%; max-width: 380px; }
  .login-card h1 { font-size: 1.35rem; margin-bottom: 6px; }
  .login-card p.sub { color: var(--muted); font-size: .85rem; margin-bottom: 24px; }

  /* 布局 */
  .layout { display: flex; min-height: 100vh; }
  aside { width: 210px; background: var(--panel); border-right: 1px solid var(--line);
          padding: 20px 12px; flex-shrink: 0; }
  aside .brand { font-weight: 600; padding: 0 10px 18px; font-size: 1rem; }
  aside .brand small { display: block; color: var(--muted); font-weight: 400; font-size: .75rem; margin-top: 3px; }
  nav button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--muted);
               padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: .9rem; margin-bottom: 2px; }
  nav button:hover { background: var(--panel2); color: var(--text); }
  nav button.active { background: var(--brand); color: #fff; }
  main { flex: 1; padding: 28px 32px; max-width: 1000px; }

  h2 { font-size: 1.2rem; margin-bottom: 4px; }
  .desc { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 18px; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row.between { justify-content: space-between; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
  .field .hint { font-size: .75rem; color: var(--muted); margin-top: 5px; }
  input, select { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--text);
                  padding: 9px 11px; border-radius: 8px; font-size: .9rem; font-family: inherit; }
  input:focus, select:focus { outline: 0; border-color: var(--brand); }
  button.btn { background: var(--brand); color: #fff; border: 0; padding: 9px 16px; border-radius: 8px;
               cursor: pointer; font-size: .88rem; font-family: inherit; white-space: nowrap; }
  button.btn:hover { filter: brightness(1.1); }
  button.btn:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button.ghost:hover { border-color: var(--brand); }
  button.danger { background: transparent; border: 1px solid var(--err); color: var(--err); }
  button.sm { padding: 5px 10px; font-size: .8rem; }

  table { width: 100%; border-collapse: collapse; font-size: .86rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: .78rem; }
  td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .72rem; }
  .badge.ok { background: rgba(63,185,80,.15); color: var(--ok); }
  .badge.off { background: rgba(154,164,178,.15); color: var(--muted); }
  .badge.env { background: rgba(210,153,34,.15); color: var(--warn); }
  .badge.db { background: rgba(108,140,255,.15); color: var(--brand); }

  .toast { position: fixed; right: 20px; bottom: 20px; background: var(--panel2); border: 1px solid var(--line);
           border-left: 3px solid var(--brand); padding: 12px 16px; border-radius: 8px; font-size: .86rem;
           max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .toast.err { border-left-color: var(--err); }
  .toast.ok { border-left-color: var(--ok); }

  .tokenbox { background: var(--panel2); border: 1px dashed var(--brand); border-radius: 8px;
              padding: 12px; margin-top: 12px; font-family: ui-monospace, Menlo, monospace; font-size: .82rem;
              word-break: break-all; }
  .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 12px;
            color: var(--muted); font-size: .84rem; margin-bottom: 18px; }
</style>
</head>
<body>

<!-- 登录 -->
<div id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <h1>read-tts 管理后台</h1>
    <p class="sub">语音合成中转服务</p>
    <div class="field">
      <label for="u">用户名</label>
      <input id="u" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="p">密码</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" style="width:100%" type="submit">登录</button>
  </form>
</div>

<!-- 主体 -->
<div id="app" class="layout hidden">
  <aside>
    <div class="brand">read-tts<small>管理后台</small></div>
    <nav>
      <button data-tab="config" class="active">上游配置</button>
      <button data-tab="tokens">调用 Token</button>
      <button data-tab="users">管理员</button>
      <button data-tab="overview">服务状态</button>
    </nav>
  </aside>
  <main>
    <div class="topbar">
      <span id="who"></span>
      <button class="btn ghost sm" id="logout">退出</button>
    </div>

    <section id="tab-config">
      <h2>上游配置</h2>
      <p class="desc">保存后立即生效，无需重启服务。留空则回落到环境变量。</p>
      <div class="card" id="configList"></div>
    </section>

    <section id="tab-tokens" class="hidden">
      <h2>调用 Token</h2>
      <p class="desc">供爱阅记等客户端调用 /v1/tts 使用。明文仅在创建时显示一次。</p>
      <div class="card">
        <div class="row">
          <input id="tokenName" placeholder="备注名称，如：我的爱阅记">
          <button class="btn" id="createToken">创建</button>
        </div>
        <div id="newToken"></div>
      </div>
      <div class="card"><table id="tokenTable"></table></div>
    </section>

    <section id="tab-users" class="hidden">
      <h2>管理员账号</h2>
      <p class="desc">用于登录本管理后台，与调用 Token 相互独立。</p>
      <div class="card">
        <div class="row">
          <input id="newUser" placeholder="用户名">
          <input id="newPass" type="password" placeholder="密码（至少 6 位）">
          <button class="btn" id="createUser">添加</button>
        </div>
      </div>
      <div class="card"><table id="userTable"></table></div>
    </section>

    <section id="tab-overview" class="hidden">
      <h2>服务状态</h2>
      <p class="desc">当前生效的默认参数与供应商。</p>
      <div class="card" id="overviewBox"></div>
    </section>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const api = async (path, opts = {}) => {
  const res = await fetch('/admin/api' + path, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || ('请求失败 ' + res.status));
  return data;
};

let toastTimer;
function toast(msg, kind = '') {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 4000);
}

/** 简单的转义，避免把服务端文本当 HTML 插入 */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const fmtTime = (v) => (v ? new Date(v).toLocaleString('zh-CN') : '—');

// ---------- 登录 ----------
async function checkAuth() {
  try {
    const { user } = await api('/me');
    if (user) return showApp(user);
  } catch (err) {
    if (/MYSQL_HOST/.test(err.message)) return showDisabled(err.message);
  }
  showLogin();
}

function showDisabled(msg) {
  $('#login').classList.remove('hidden');
  $('#loginForm').innerHTML = '<h1>管理端不可用</h1><p class="sub">' + esc(msg) + '</p>';
}

function showLogin() {
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
}

function showApp(user) {
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#who').textContent = user.username;
  loadOverview();
}

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    const { username } = await api('/login', {
      method: 'POST',
      body: { username: $('#u').value, password: $('#p').value },
    });
    toast('登录成功', 'ok');
    showApp({ username });
  } catch (err) {
    toast(err.message, 'err');
  } finally {
    btn.disabled = false;
  }
});

$('#logout').addEventListener('click', async () => {
  await api('/logout', { method: 'POST' }).catch(() => {});
  location.reload();
});

// ---------- 标签切换 ----------
document.querySelectorAll('nav button').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    ['config', 'tokens', 'users', 'overview'].forEach((t) =>
      $('#tab-' + t).classList.toggle('hidden', t !== btn.dataset.tab));
    if (btn.dataset.tab === 'tokens') loadTokens();
    if (btn.dataset.tab === 'users') loadUsers();
    if (btn.dataset.tab === 'overview') loadOverview();
  });
});

// ---------- 配置 ----------
async function loadConfig() {
  const { items } = await api('/config');
  $('#configList').innerHTML = items.map((it) => `
    <div class="field">
      <label>${esc(it.label)}
        <span class="badge ${it.source === 'database' ? 'db' : 'env'}">
          ${it.source === 'database' ? '数据库' : '环境变量'}
        </span>
      </label>
      <div class="row">
        <input data-key="${esc(it.key)}" value="${esc(it.value)}"
               placeholder="${it.secret ? '未设置' : ''}" ${it.secret ? 'type="password"' : ''}>
        <button class="btn sm" data-save="${esc(it.key)}">保存</button>
      </div>
      <div class="hint">${esc(it.description)}</div>
    </div>`).join('');

  $('#configList').querySelectorAll('[data-save]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const key = btn.dataset.save;
      const input = $('#configList').querySelector(`input[data-key="${key}"]`);
      btn.disabled = true;
      try {
        await api('/config/' + key, { method: 'PUT', body: { value: input.value } });
        toast('已保存：' + key, 'ok');
        loadConfig();
      } catch (err) {
        toast(err.message, 'err');
      } finally {
        btn.disabled = false;
      }
    });
  });
}

// ---------- Token ----------
async function loadTokens() {
  const { items } = await api('/tokens');
  $('#tokenTable').innerHTML = `
    <tr><th>名称</th><th>前缀</th><th>状态</th><th>最后使用</th><th>创建时间</th><th></th></tr>
    ${items.map((t) => `
      <tr>
        <td>${esc(t.name)}</td>
        <td class="mono">${esc(t.token_prefix)}…</td>
        <td><span class="badge ${t.enabled ? 'ok' : 'off'}">${t.enabled ? '启用' : '停用'}</span></td>
        <td>${fmtTime(t.last_used_at)}</td>
        <td>${fmtTime(t.created_at)}</td>
        <td class="row">
          <button class="btn ghost sm" data-toggle="${t.id}" data-on="${t.enabled ? 1 : 0}">
            ${t.enabled ? '停用' : '启用'}
          </button>
          <button class="btn danger sm" data-del="${t.id}">删除</button>
        </td>
      </tr>`).join('') || ''}`;

  $('#tokenTable').querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', async () => {
    await api(`/tokens/${b.dataset.toggle}/toggle`, { method: 'POST', body: { enabled: !Number(b.dataset.on) } })
      .then(() => { toast('已更新', 'ok'); loadTokens(); })
      .catch((e) => toast(e.message, 'err'));
  }));
  $('#tokenTable').querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', async () => {
    if (!confirm('确定删除该 Token？删除后使用它的客户端将无法调用。')) return;
    await api('/tokens/' + b.dataset.del, { method: 'DELETE' })
      .then(() => { toast('已删除', 'ok'); loadTokens(); })
      .catch((e) => toast(e.message, 'err'));
  }));
}

$('#createToken').addEventListener('click', async () => {
  const name = $('#tokenName').value.trim();
  if (!name) return toast('请填写名称', 'err');
  try {
    const created = await api('/tokens', { method: 'POST', body: { name } });
    $('#newToken').innerHTML =
      `<div class="tokenbox">请立即复制保存，关闭后不再显示：<br><b>${esc(created.token)}</b></div>`;
    $('#tokenName').value = '';
    loadTokens();
  } catch (err) { toast(err.message, 'err'); }
});

// ---------- 管理员 ----------
async function loadUsers() {
  const { items } = await api('/users');
  $('#userTable').innerHTML = `
    <tr><th>用户名</th><th>最近登录</th><th>创建时间</th><th></th></tr>
    ${items.map((u) => `
      <tr>
        <td>${esc(u.username)}</td>
        <td>${fmtTime(u.last_login_at)}</td>
        <td>${fmtTime(u.created_at)}</td>
        <td class="row">
          <button class="btn ghost sm" data-pw="${u.id}" data-name="${esc(u.username)}">改密</button>
          <button class="btn danger sm" data-deluser="${u.id}">删除</button>
        </td>
      </tr>`).join('')}`;

  $('#userTable').querySelectorAll('[data-pw]').forEach((b) => b.addEventListener('click', async () => {
    const pw = prompt(`为 ${b.dataset.name} 设置新密码（至少 6 位）`);
    if (!pw) return;
    await api(`/users/${b.dataset.pw}/password`, { method: 'POST', body: { password: pw } })
      .then(() => toast('密码已更新，该账号需重新登录', 'ok'))
      .catch((e) => toast(e.message, 'err'));
  }));
  $('#userTable').querySelectorAll('[data-deluser]').forEach((b) => b.addEventListener('click', async () => {
    if (!confirm('确定删除该管理员？')) return;
    await api('/users/' + b.dataset.deluser, { method: 'DELETE' })
      .then(() => { toast('已删除', 'ok'); loadUsers(); })
      .catch((e) => toast(e.message, 'err'));
  }));
}

$('#createUser').addEventListener('click', async () => {
  try {
    await api('/users', { method: 'POST', body: { username: $('#newUser').value, password: $('#newPass').value } });
    toast('已添加', 'ok');
    $('#newUser').value = ''; $('#newPass').value = '';
    loadUsers();
  } catch (err) { toast(err.message, 'err'); }
});

// ---------- 概览 ----------
async function loadOverview() {
  try {
    const data = await api('/overview');
    $('#overviewBox').innerHTML = `
      <div class="field"><label>可用供应商</label><div>${data.providers.map((p) => `<span class="badge ok">${esc(p)}</span>`).join(' ')}</div></div>
      <div class="field"><label>默认供应商</label><div>${esc(data.defaults.provider)}</div></div>
      <div class="field"><label>默认音色</label><div>${esc(data.defaults.voice)}</div></div>
      <div class="field"><label>默认格式</label><div>${esc(data.defaults.format)}</div></div>
      <div class="field"><label>启用中的调用 Token</label><div>${data.tokens.enabled} 个</div></div>`;
    loadConfig();
  } catch (err) { toast(err.message, 'err'); }
}

checkAuth();
</script>
</body>
</html>
